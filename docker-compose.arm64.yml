name: scopesentry

networks:
  scopesentry-network:
    name: scopesentry-network
    driver: bridge
  web-net:
    external: true

services:
  mongodb:
    image: mongo:7.0
    container_name: scopesentry-mongodb
    restart: always
    # 只绑定本机回环:扫描端走 host 网络通过 127.0.0.1 访问,公网不可达
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./data/mongodb:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    networks:
      - scopesentry-network

  redis:
    image: redis:7.0
    container_name: scopesentry-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks:
      - scopesentry-network

  scope-sentry:
    build:
      context: .
      dockerfile: dockerfile.arm64
    image: scopesentry-server-arm64:1.9.4
    container_name: scope-sentry
    restart: always
    # Web UI 只暴露给本机,由 nginx 反代对外
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      TIMEZONE: Asia/Shanghai
      MONGODB_IP: scopesentry-mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      REDIS_IP: scopesentry-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8082 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    mem_limit: 2g
    volumes:
      - ./data/files:/opt/ScopeSentry/files
      - ./data/images:/opt/ScopeSentry/images
      - ./data/uploads:/opt/ScopeSentry/uploads
    networks:
      - scopesentry-network
      - web-net   # 供 nginx 反代按容器名访问

  scopesentry-scan:
    build:
      context: ./scan-build
      dockerfile: dockerfile
    image: scopesentry-scan-arm64:1.9.1
    network_mode: host
    container_name: scopesentry-scan
    restart: always
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      NodeName: node
      TimeZoneName: Asia/Shanghai
      # go-rod(httpx 截图/浏览器指纹)使用镜像内 apt 安装的 chromium,
      # 不让它在线下载(在线源没有 arm64 版本)
      ROD_BROWSER_BIN: /usr/bin/chromium
      MONGODB_IP: 127.0.0.1
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${MONGO_INITDB_ROOT_USERNAME}
      MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      REDIS_IP: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      scope-sentry:
        condition: service_healthy
    mem_limit: 6g
